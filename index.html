<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthoscope</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <script type="module" crossorigin src="./assets/main-CY-Xvbg2.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main-Di3dbQW5.css">
</head>
<body id="main-body" class="audio-uninitialized">
    <div id="top-ui-wrapper">
      <div id="party-button-container"></div>
      <div id="looper-controls-container">
        <div id="rec-button-container"></div>
        <div id="stop-all-button-container"></div>
        <div id="loop-scroll-left" class="looper-button loop-scroll-button" style="display: none;">&lt;</div>
        <div id="looper-overview-container"></div>
        <div id="loop-scroll-right" class="looper-button loop-scroll-button" style="display: none;">&gt;</div>
      </div>
      <div id="top-right-controls">
        <div id="output-record-button-container">
            <div id="output-record-button" title="Record Audio Output">&#9022;</div>
        </div>
        <div id="panic-button-container">
            <div id="panic-button"><span class="full-text">PANIC</span><span class="short-text">!</span></div>
        </div>
        <div id="help-button-container">
            <div id="help-button">?</div>
        </div>
      </div>
    </div>
    
    <div class="canvas-container">
      <canvas id="gl-canvas"></canvas>
      <canvas id="visualizer-canvas"></canvas>
      <canvas id="objects-canvas"></canvas>
      <canvas id="ui-canvas"></canvas>
      
      <!-- DOM Cursor Layer -->
      <div id="cursor-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; overflow: hidden;">
          <div id="cursor-crosshair-h" style="position: absolute; height: 2px; width: 30px; background-color: var(--theme-default); transform: translate(-50%, -50%); display: none; will-change: transform;"></div>
          <div id="cursor-crosshair-v" style="position: absolute; width: 2px; height: 30px; background-color: var(--theme-default); transform: translate(-50%, -50%); display: none; will-change: transform;"></div>
          <div id="cursor-label" style="position: absolute; color: var(--theme-default); font-family: monospace; font-size: 15px; margin-left: 20px; margin-top: -20px; white-space: pre; display: none; will-change: transform; text-shadow: 0 0 2px currentColor;"></div>
      </div>
      
      <!-- MOVED REPL INSIDE CANVAS CONTAINER -->
      <div id="repl-container">
          <div id="repl-output"></div>
          <div id="repl-input-wrapper">
              <span id="repl-prompt">&gt;</span>
              <input id="repl-input" type="text" spellcheck="false" autocomplete="off" />
              <span id="repl-cursor"></span>
          </div>
      </div>
    </div>

    <!-- MOVED menu-popup-container outside bottom-elements-wrapper for fixed positioning -->
    <div id="menu-popup-container" style="display: none;"></div>

    <div id="bottom-elements-wrapper">
      <div id="bottom-bar-container">
        <div id="repl-toggle-button-container">
            <div id="repl-toggle-button">&gt;</div>
        </div>
        <div id="mode-bar-container">
          <div id="mode-scroll-left" class="mode-scroll-button" style="display: none;">&lt;</div>
          <!-- JS inserts mode buttons here -->
          <div id="mode-scroll-right" class="mode-scroll-button" style="display: none;">&gt;</div>
        </div>
        <div style="width: 75px; flex-shrink: 0;"></div> <!-- Increased Spacer to balance REPL buttons -->
      </div>
      <div id="worm-game-button">~</div>
    </div>

    <div id="help-modal" style="display: none;">
      <div id="help-modal-content-wrapper">
        <div id="help-modal-content"></div>
      </div>
    </div>
</body>
</html>
